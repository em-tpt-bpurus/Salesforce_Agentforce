<template>
    <div class="dashboard-shell">

        <!-- ═══════════════════════════════════════════════════ -->
        <!-- LEFT PANEL — existing dashboard (unchanged layout) -->
        <!-- ═══════════════════════════════════════════════════ -->
        <div class="dashboard">

            <!-- Header -->
            <div class="dashboard-header">
                <div class="header-left">
                    <div class="header-icon">
                        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                            <rect x="2" y="2" width="11" height="11" rx="2" fill="#00A1E0"/>
                            <rect x="15" y="2" width="11" height="11" rx="2" fill="#0070D2"/>
                            <rect x="2" y="15" width="11" height="11" rx="2" fill="#0070D2"/>
                            <rect x="15" y="15" width="11" height="11" rx="2" fill="#032D60"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="header-title">Org Metadata Dashboard</h1>
                        <p class="header-subtitle">Flows · Apex · Triggers · LWC · Aura · Profiles · Permission Sets · Fields · Objects · Validation Rules · VF Pages · VF Components</p>
                    </div>
                </div>
                <button class="refresh-btn" onclick={handleRefreshAll} disabled={isLoading}>
                    <svg class={refreshIconClass} width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M13.65 2.35A8 8 0 1 0 15 8h-2a6 6 0 1 1-1.08-3.47L10 6h5V1l-1.35 1.35z" fill="currentColor"/>
                    </svg>
                    <span>{refreshLabel}</span>
                </button>

            </div>

            <!-- Tab Nav — Row 1 -->
            <div class="tab-nav">
                <button class={flowTabClass} onclick={showFlows}>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <path d="M2 3h3v3H2zM6.5 4.5h7M2 9h3v3H2zM6.5 10.5h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    Flows <span class={flowTabBadgeClass}>{flowTabBadge}</span>
                </button>
                <button class={apexTabClass} onclick={showApex}>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <path d="M4 4l-2 4 2 4M12 4l2 4-2 4M7 13l2-10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Apex <span class={apexTabBadgeClass}>{apexTabBadge}</span>
                </button>
                <button class={triggerTabClass} onclick={showTriggers}>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <path d="M8 1v6l3 3M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    Triggers <span class={triggerTabBadgeClass}>{triggerTabBadge}</span>
                </button>
                <button class={lwcTabClass} onclick={showLwc}>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <rect x="2" y="5" width="12" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M6 8l2 2 2-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M5 5V4a3 3 0 0 1 6 0v1" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    LWC <span class={lwcTabBadgeClass}>{lwcTabBadge}</span>
                </button>
                <button class={auraTabClass} onclick={showAura}>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <path d="M8 2 L14 5 L14 11 L8 14 L2 11 L2 5 Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        <circle cx="8" cy="8" r="2" fill="currentColor"/>
                    </svg>
                    Aura <span class={auraTabBadgeClass}>{auraTabBadge}</span>
                </button>
            </div>

            <!-- Tab Nav — Row 2 -->
            <div class="tab-nav tab-nav-row2">
                <button class={profileTabClass} onclick={showProfiles}>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M2 14c0-3.314 2.686-5 6-5s6 1.686 6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    Profiles <span class={profileTabBadgeClass}>{profileTabBadge}</span>
                </button>
                <button class={permSetTabClass} onclick={showPermSets}>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <rect x="3" y="2" width="10" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M6 6h4M6 9h4M6 12h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    Perm Sets <span class={permSetTabBadgeClass}>{permSetTabBadge}</span>
                </button>
                <button class={fieldTabClass} onclick={showFields}>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <rect x="2" y="4" width="12" height="8" rx="1" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M2 7h12" stroke="currentColor" stroke-width="1"/>
                        <path d="M6 4v8" stroke="currentColor" stroke-width="1"/>
                    </svg>
                    Fields <span class={fieldTabBadgeClass}>{fieldTabBadge}</span>
                </button>
                <button class={objectTabClass} onclick={showObjects}>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <ellipse cx="8" cy="5" rx="6" ry="2.5" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M2 5v6c0 1.38 2.686 2.5 6 2.5S14 12.38 14 11V5" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    Objects <span class={objectTabBadgeClass}>{objectTabBadge}</span>
                </button>
                <button class={vrTabClass} onclick={showVr}>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M8 5v3l2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    Val. Rules <span class={vrTabBadgeClass}>{vrTabBadge}</span>
                </button>
                <!-- VF Pages tab -->
                <button class={vfTabClass} onclick={showVf}>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M5 7l2 2-2 2M9 11h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    VF Pages <span class={vfTabBadgeClass}>{vfTabBadge}</span>
                </button>
                <!-- VF Components tab -->
                <button class={vfcTabClass} onclick={showVfc}>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M5 7h2M5 9h4M9 7l2 2-2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    VF Comp <span class={vfcTabBadgeClass}>{vfcTabBadge}</span>
                </button>
            </div>

            <!-- Namespace Filter Bar -->
            <template if:true={showNamespaceFilter}>
                <div class="ns-filter-bar">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <input class="ns-filter-input"
                           type="text"
                           placeholder="Filter by namespace (e.g. ITSms, FinanceApp)"
                           value={namespaceInput}
                           oninput={handleNamespaceInput}
                           onkeydown={handleNamespaceKeydown}/>
                    <button class={nsFilterApplyClass} onclick={handleNamespaceApply} disabled={isLoading}>
                        {nsFilterApplyLabel}
                    </button>
                    <template if:true={namespaceFilterActive}>
                        <button class="ns-filter-clear" onclick={handleNamespaceClear} title="Clear filter">
                            ✕
                        </button>
                    </template>
                </div>
                <template if:true={namespaceFilterActive}>
                    <div class="ns-active-bar">
                        <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
                            <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        Filtering by: {nsActiveFilterLabel}
                        <span class="ns-active-bar-hint">— showing matched results only. Click ✕ to clear.</span>
                    </div>
                </template>
            </template>

            <!-- Loading State -->
            <template if:true={isLoading}>
                <div class="loading-container">
                    <div class="spinner"></div>
                    <p class="loading-text">Fetching metadata...</p>
                </div>
            </template>

            <!-- Error State -->
            <template if:true={hasError}>
                <div class="error-banner">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                        <circle cx="9" cy="9" r="8" stroke="#c23934" stroke-width="1.5"/>
                        <path d="M9 5v4M9 12v1" stroke="#c23934" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>{errorMessage}</span>
                </div>
            </template>

            <!-- ═══════════════════════════════════════════════ -->
            <!-- FLOWS TAB -->
            <!-- ═══════════════════════════════════════════════ -->
            <template if:true={showFlowsTab}>
                <template if:false={isLoading}>
                    <div class="section-fade">
                        <div class="stats-row">
                            <div class={cardClassFlowTotal} data-filter="total" onclick={handleStatCardClick} title="Click to filter">
                                <div class="stat-value">{flowTotalDisplay}</div>
                                <div class="stat-label">Total Flows</div>
                            </div>
                            <div class={cardClassActive} data-filter="active" onclick={handleStatCardClick} title="Click to filter">
                                <div class="stat-dot dot-green"></div>
                                <div class="stat-value">{flowActiveDisplay}</div>
                                <div class="stat-label">Active</div>
                            </div>
                            <div class={cardClassInactive} data-filter="inactive" onclick={handleStatCardClick} title="Click to filter">
                                <div class="stat-dot dot-gray"></div>
                                <div class="stat-value">{flowInactiveDisplay}</div>
                                <div class="stat-label">Inactive</div>
                            </div>
                            <div class={cardClassUsed} data-filter="used" onclick={handleStatCardClick} title="Click to filter">
                                <div class="stat-dot dot-teal"></div>
                                <div class="stat-value">{flowUsedDisplay}</div>
                                <div class="stat-label">Used</div>
                            </div>
                            <div class={cardClassUnused} data-filter="unused" onclick={handleStatCardClick} title="Click to filter">
                                <div class="stat-dot dot-orange"></div>
                                <div class="stat-value">{flowUnusedDisplay}</div>
                                <div class="stat-label">Unused</div>
                            </div>
                        </div>
                        <template if:true={showActiveSection}>
                        <div class="list-section">
                            <div class="list-header">
                                <span class="list-title">Active Flows</span>
                                <span class="list-count green">{flowActiveDisplay}</span>
                            </div>
                            <template if:true={activeFlowDisplayList.length}>
                                <ul class="metadata-list">
                                    <template for:each={activeFlowDisplayList} for:item="flow">
                                        <li key={flow.index} class="list-item">
                                            <span class="status-dot dot-green"></span>
                                            <span class="item-index">{flow.index}.</span>
                                            <span class="item-name">{flow.name}</span>
                                            <span class="flow-type-badge">{flow.processTypeLabel}</span>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:false={activeFlowDisplayList.length}>
                                <p class="empty-state">No active flows found matching {nsActiveFilterLabel}.</p>
                            </template>
                        </div>
                        </template>
                        <template if:true={showInactiveSection}>
                        <div class="list-section list-section-warn">
                            <div class="list-header">
                                <span class="list-title">Inactive Flows</span>
                                <span class="list-count gray">{flowInactiveDisplay}</span>
                                <span class="delete-badge">Unused — safe to review</span>
                            </div>
                            <template if:true={inactiveFlowDisplayList.length}>
                                <ul class="metadata-list">
                                    <template for:each={inactiveFlowDisplayList} for:item="flow">
                                        <li key={flow.index} class="list-item list-item-warn">
                                            <span class="status-dot dot-gray"></span>
                                            <span class="item-index">{flow.index}.</span>
                                            <span class="item-name">{flow.name}</span>
                                            <span class="flow-type-badge">{flow.processTypeLabel}</span>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:false={inactiveFlowDisplayList.length}>
                                <p class="empty-state">No inactive flows found matching {nsActiveFilterLabel}.</p>
                            </template>
                        </div>
                        </template>
                        <template if:true={showUsedSection}>
                        <div class="list-section">
                            <div class="list-header">
                                <span class="list-title">Used Flows</span>
                                <span class="list-count teal">{flowUsedDisplay}</span>
                                <span class="protect-badge">Actively referenced</span>
                            </div>
                            <template if:true={usedFlowDisplayList.length}>
                                <ul class="metadata-list">
                                    <template for:each={usedFlowDisplayList} for:item="flow">
                                        <li key={flow.index} class="list-item">
                                            <span class="status-dot dot-teal"></span>
                                            <span class="item-index">{flow.index}.</span>
                                            <span class="item-name">{flow.name}</span>
                                            <template if:true={flow.isInactive}>
                                                <span class="flow-warning-badge">Inactive</span>
                                            </template>
                                            <template if:false={flow.isInactive}>
                                                <span class="flow-warning-badge flow-warning-badge--active">Active</span>
                                            </template>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:false={usedFlowDisplayList.length}>
                                <p class="empty-state">No used flows found.</p>
                            </template>
                        </div>
                        </template>
                        <template if:true={showUnusedSection}>
                        <div class="list-section list-section-warn">
                            <div class="list-header">
                                <span class="list-title">Unused Flows</span>
                                <span class="list-count orange">{flowUnusedDisplay}</span>
                                <span class="delete-badge">Safe to review / delete</span>
                            </div>
                            <template if:true={unusedFlowDisplayList.length}>
                                <ul class="metadata-list">
                                    <template for:each={unusedFlowDisplayList} for:item="flow">
                                        <li key={flow.index} class="list-item list-item-warn">
                                            <span class="status-dot dot-orange"></span>
                                            <span class="item-index">{flow.index}.</span>
                                            <span class="item-name">{flow.name}</span>
                                            <template if:true={flow.isActive}>
                                                <span class="flow-warning-badge flow-warning-badge--active">Active</span>
                                            </template>
                                            <template if:false={flow.isActive}>
                                                <span class="flow-warning-badge">Inactive</span>
                                            </template>
                                            <button class="agent-delete-btn" data-type="flow" data-name={flow.apiName} onclick={handleAgentDeleteFromList} title="Ask agent to delete">
                                                <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
                                                    <path d="M3 4h10M5 4V3h6v1M6 7v5M10 7v5M4 4l1 9h6l1-9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                                </svg>
                                            </button>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:false={unusedFlowDisplayList.length}>
                                <p class="empty-state">No unused flows found.</p>
                            </template>
                        </div>
                        </template>
                    </div>
                </template>
            </template>

            <!-- ═══════════════════════════════════════════════ -->
            <!-- APEX TAB -->
            <!-- ═══════════════════════════════════════════════ -->
            <template if:true={showApexTab}>
                <template if:false={isLoading}>
                    <div class="section-fade">
                        <div class="stats-row">
                            <div class={cardClassTotal} data-filter="total" onclick={handleStatCardClick} title="Click to filter">
                                <div class="stat-value">{apexTotalDisplay}</div>
                                <div class="stat-label">Total</div>
                            </div>
                            <div class={cardClassStandard} data-filter="standard" onclick={handleStatCardClick} title="Click to filter">
                                <div class="stat-dot dot-blue"></div>
                                <div class="stat-value">{apexStandardDisplay}</div>
                                <div class="stat-label">Standard</div>
                            </div>
                            <div class={cardClassUsed} data-filter="used" onclick={handleStatCardClick} title="Click to filter">
                                <div class="stat-dot dot-green"></div>
                                <div class="stat-value">{apexUsedDisplay}</div>
                                <div class="stat-label">Used</div>
                            </div>
                            <div class={cardClassUnused} data-filter="unused" onclick={handleStatCardClick} title="Click to filter">
                                <div class="stat-dot dot-orange"></div>
                                <div class="stat-value">{apexUnusedDisplay}</div>
                                <div class="stat-label">Unused</div>
                            </div>
                            <div class={cardClassTest} data-filter="test" onclick={handleStatCardClick} title="Click to filter">
                                <div class="stat-dot dot-purple"></div>
                                <div class="stat-value">{apexTestDisplay}</div>
                                <div class="stat-label">Test</div>
                            </div>
                        </div>
                        <template if:true={showStandardSection}>
                        <div class="list-section">
                            <div class="list-header">
                                <span class="list-title">Standard / Package Classes</span>
                                <span class="list-count blue">{apexStandardDisplay}</span>
                                <span class="protect-badge">Do NOT delete</span>
                            </div>
                            <template if:true={standardClassDisplayList.length}>
                                <ul class="metadata-list">
                                    <template for:each={standardClassDisplayList} for:item="cls">
                                        <li key={cls.index} class="list-item">
                                            <span class="status-dot dot-blue"></span>
                                            <span class="item-index">{cls.index}.</span>
                                            <span class="item-name">{cls.name}</span>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:false={standardClassDisplayList.length}>
                                <p class="empty-state">No standard/package classes found matching {nsActiveFilterLabel}.</p>
                            </template>
                        </div>
                        </template>
                        <template if:true={showUsedSection}>
                        <div class="list-section">
                            <div class="list-header">
                                <span class="list-title">Custom Used Classes</span>
                                <span class="list-count green">{apexUsedDisplay}</span>
                            </div>
                            <template if:true={usedClassDisplayList.length}>
                                <ul class="metadata-list">
                                    <template for:each={usedClassDisplayList} for:item="cls">
                                        <li key={cls.index} class="list-item">
                                            <span class="status-dot dot-green"></span>
                                            <span class="item-index">{cls.index}.</span>
                                            <span class="item-name">{cls.name}</span>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:false={usedClassDisplayList.length}>
                                <p class="empty-state">No used classes found matching {nsActiveFilterLabel}.</p>
                            </template>
                        </div>
                        </template>
                        <template if:true={showUnusedSection}>
                        <div class="list-section list-section-warn">
                            <div class="list-header">
                                <span class="list-title">Custom Possibly-Unused Classes</span>
                                <span class="list-count orange">{apexUnusedDisplay}</span>
                                <span class="delete-badge">Verify before deleting</span>
                            </div>
                            <template if:true={unusedClassDisplayList.length}>
                                <ul class="metadata-list">
                                    <template for:each={unusedClassDisplayList} for:item="cls">
                                        <li key={cls.index} class="list-item list-item-warn">
                                            <span class="status-dot dot-orange"></span>
                                            <span class="item-index">{cls.index}.</span>
                                            <div class="item-detail">
                                                <span class="item-name">{cls.name}</span>
                                                <span class="item-meta">{cls.meta}</span>
                                            </div>
                                            <button class="agent-delete-btn" data-type="apex" data-name={cls.name} onclick={handleAgentDeleteFromList} title="Ask agent to delete">
                                                <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
                                                    <path d="M3 4h10M5 4V3h6v1M6 7v5M10 7v5M4 4l1 9h6l1-9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                                </svg>
                                            </button>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:false={unusedClassDisplayList.length}>
                                <p class="empty-state">No unused classes found matching {nsActiveFilterLabel}.</p>
                            </template>
                        </div>
                        </template>
                        <template if:true={showTestSection}>
                        <div class="list-section">
                            <div class="list-header">
                                <span class="list-title">Test Classes</span>
                                <span class="list-count purple">{apexTestDisplay}</span>
                                <span class="protect-badge">Do NOT delete</span>
                            </div>
                            <template if:true={testClassDisplayList.length}>
                                <ul class="metadata-list">
                                    <template for:each={testClassDisplayList} for:item="cls">
                                        <li key={cls.index} class="list-item">
                                            <span class="status-dot dot-purple"></span>
                                            <span class="item-index">{cls.index}.</span>
                                            <span class="item-name">{cls.name}</span>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:false={testClassDisplayList.length}>
                                <p class="empty-state">No test classes found matching {nsActiveFilterLabel}.</p>
                            </template>
                        </div>
                        </template>
                    </div>
                </template>
            </template>

            <!-- ═══════════════════════════════════════════════ -->
            <!-- TRIGGERS TAB -->
            <!-- ═══════════════════════════════════════════════ -->
            <template if:true={showTriggersTab}>
                <template if:false={isLoading}>
                    <div class="section-fade">
                        <div class="stats-row">
                            <div class={cardClassTotal} data-filter="total" onclick={handleStatCardClick} title="Click to filter">
                                <div class="stat-value">{triggerTotalDisplay}</div>
                                <div class="stat-label">Total</div>
                            </div>
                            <div class={cardClassActive} data-filter="active" onclick={handleStatCardClick} title="Click to filter">
                                <div class="stat-dot dot-green"></div>
                                <div class="stat-value">{triggerActiveDisplay}</div>
                                <div class="stat-label">Active</div>
                            </div>
                            <div class={cardClassInactive} data-filter="inactive" onclick={handleStatCardClick} title="Click to filter">
                                <div class="stat-dot dot-gray"></div>
                                <div class="stat-value">{triggerInactiveDisplay}</div>
                                <div class="stat-label">Inactive</div>
                            </div>
                            <div class={cardClassUsed} data-filter="used" onclick={handleStatCardClick} title="Click to filter">
                                <div class="stat-dot dot-teal"></div>
                                <div class="stat-value">{triggerUsedDisplay}</div>
                                <div class="stat-label">Used</div>
                            </div>
                            <div class={cardClassUnused} data-filter="unused" onclick={handleStatCardClick} title="Click to filter">
                                <div class="stat-dot dot-orange"></div>
                                <div class="stat-value">{triggerUnusedDisplay}</div>
                                <div class="stat-label">Unused</div>
                            </div>
                        </div>
                        <template if:true={showUsedSection}>
                        <div class="list-section">
                            <div class="list-header">
                                <span class="list-title">Used Triggers</span>
                                <span class="list-count teal">{triggerUsedDisplay}</span>
                                <span class="protect-badge">Actively referenced</span>
                            </div>
                            <template if:true={usedTriggerDisplayList.length}>
                                <ul class="metadata-list">
                                    <template for:each={usedTriggerDisplayList} for:item="trig">
                                        <li key={trig.index} class="list-item">

        <!-- RIGHT PANEL — Org Cleanup Agent                     -->

        <div class="agent-panel">

            <!-- Agent Header -->
            <div class="agent-header">
                <div class="agent-avatar">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="7" r="3.5" stroke="#0070D2" stroke-width="1.5"/>
                        <path d="M3 18c0-3.866 3.134-6 7-6s7 2.134 7 6" stroke="#0070D2" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="agent-header-info">
                    <span class="agent-name">{agentHeaderName}</span>
                    <span class="agent-status">
                        <span class="status-pulse"></span>
                        {agentHeaderStatus}
                    </span>
                </div>

                <!-- Live Org Health Gauge -->
                <div class={liveScoreFlashClass} title={liveHealthLabel}>
                    <svg class="health-gauge__ring" width="64" height="64" viewBox="0 0 64 64">
                        <!-- Background track -->
                        <circle cx="32" cy="32" r="28" fill="none" stroke="#e8e8e8" stroke-width="5"/>
                        <!-- Score arc — stroke-dashoffset driven by liveHealthRingOffset -->
                        <circle cx="32" cy="32" r="28" fill="none" stroke-width="5"
                            stroke-linecap="round"
                            stroke-dasharray="175.9"
                            stroke-dashoffset={liveHealthRingOffset}
                            stroke={liveHealthColor}
                            transform="rotate(-90 32 32)"/>
                        <!-- Score number -->
                        <text x="32" y="36" text-anchor="middle" class="health-gauge__num">{liveHealthPercent}</text>
                    </svg>
                    <div class="health-gauge__info">
                        <span class="health-gauge__label">{liveHealthLabel}</span>
                        <span class="health-gauge__issues">{liveIssueCount} issues</span>
                        <template if:true={showDeltaBadge}>
                            <span class="health-gauge__delta">{deltaBadgeText}</span>
                        </template>
                    </div>
                </div>
            </div>


            <!-- Chat Messages -->
            <div class="agent-messages" lwc:ref="messagesContainer">
                <template for:each={agentMessages} for:item="msg">
                    <div key={msg.id} class={msg.cssClass}>
                        <template if:true={msg.isAgent}>
                            <div class="msg-avatar-sm">
                                <svg width="12" height="12" viewBox="0 0 20 20" fill="none">
                                    <circle cx="10" cy="7" r="3.5" stroke="#0070D2" stroke-width="1.5"/>
                                    <path d="M3 18c0-3.866 3.134-6 7-6s7 2.134 7 6" stroke="#0070D2" stroke-width="1.5" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </template>
                        <div class="msg-bubble">
                            <template if:true={msg.isTyping}>
                                <div class="typing-dots">
                                    <span></span><span></span><span></span>
                                </div>
                            </template>
                            <template if:false={msg.isTyping}>
                                <template if:true={msg.isReferenceReport}>
                                    <template if:true={msg.isDataLossReport}>
                                        <pre class="msg-ref-report msg-ref-report--dataloss">{msg.text}</pre>
                                    </template>
                                    <template if:false={msg.isDataLossReport}>
                                        <pre class="msg-ref-report">{msg.text}</pre>
                                    </template>
                                </template>
                                <template if:true={msg.isOrgHealth}>
                                    <div class="health-card">
                                        <!-- Header: title + score badge -->
                                        <div class="health-card__header">
                                            <span class="health-card__title">&#x1F3E5; Org Health Report</span>
                                            <span class={msg.orgHealth.scoreClass}>{msg.orgHealth.score}</span>
                                        </div>
                                        <!-- Total issues pill -->
                                        <div class="health-card__issues">
                                            &#x26A0; Total Issues: <strong>{msg.orgHealth.totalIssues}</strong>
                                        </div>
                                        <!-- Org size summary grid -->
                                        <div class="health-card__section-label">&#x1F4CA; Org Size Summary</div>
                                        <div class="health-summary-grid">
                                            <template for:each={msg.orgHealth.summaryRows} for:item="row">
                                                <div key={row.label} class="health-summary-row">
                                                    <span class="health-summary-label">{row.label}</span>
                                                    <span class="health-summary-value">{row.value}</span>
                                                </div>
                                            </template>
                                            <template if:false={msg.orgHealth.hasSummaryRows}>
                                                <div class="health-summary-empty">No summary data available</div>
                                            </template>
                                        </div>
                                        <!-- Cleanup recommendations -->
                                        <template if:true={msg.orgHealth.recs.length}>
                                            <div class="health-card__section-label">&#x1F5D1; Cleanup Recommendations</div>
                                            <template for:each={msg.orgHealth.recs} for:item="rec">
                                                <div key={rec.num} class={rec.recClass}>
                                                    <div class="health-rec__header">
                                                        <span class={rec.levelClass}>{rec.level}</span>
                                                        <span class="health-rec__text">{rec.num}. {rec.text}</span>
                                                    </div>
                                                    <template for:each={rec.actions} for:item="action">
                                                        <div key={action} class="health-rec__action">{action}</div>
                                                    </template>
                                                </div>
                                            </template>
                                        </template>
                                        <template if:false={msg.orgHealth.recs.length}>
                                            <div class="health-rec-empty">&#x2705; No cleanup recommendations — org looks clean!</div>
                                        </template>

                                        <!-- ── Pillar Breakdown ── -->
                                        <template if:true={msg.orgHealth.pillars.length}>
                                            <div class="health-card__section-label">&#x1F4CA; Pillar Breakdown</div>
                                            <div class="health-pillars">
                                                <template for:each={msg.orgHealth.pillars} for:item="p">
                                                    <div key={p.label} class={p.pillarClass}>
                                                        <div class="health-pillar__top">
                                                            <span class="health-pillar__label">{p.label}</span>
                                                            <span class="health-pillar__weight">{p.weight}</span>
                                                        </div>
                                                        <div class="health-pillar__pct">{p.pct}%</div>
                                                        <div class="health-pillar__status">{p.status}</div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                        <!-- ── Security Pillar Detail ── -->
                                        <template if:true={msg.orgHealth.secFindings.length}>
                                            <div class="health-card__section-label">&#x1F510; Security Findings</div>
                                            <template if:true={msg.orgHealth.secChecks}>
                                                <div class="health-sec__checks">Checks passed: {msg.orgHealth.secChecks}</div>
                                            </template>
                                            <template for:each={msg.orgHealth.secFindings} for:item="f">
                                                <div key={f} class="health-sec__finding">{f}</div>
                                            </template>
                                        </template>

                                        <!-- ── License Pillar Detail ── -->
                                        <template if:true={msg.orgHealth.licData}>
                                            <div class="health-card__section-label">&#x1F4B0; License Details</div>
                                            <div class="lic-summary-grid">
                                                <!-- User Licenses card -->
                                                <div class="lic-metric-card">
                                                    <div class="lic-metric-card__header">
                                                        <span class="lic-metric-card__title">User Licenses</span>
                                                        <span class="lic-metric-card__badge lic-metric-card__badge--warn">{msg.orgHealth.licData.summary.ulWasted} wasted types</span>
                                                    </div>
                                                    <div class="lic-metric-card__nums">
                                                        <span class="lic-metric-card__used">{msg.orgHealth.licData.summary.ulUsed}</span>
                                                        <span class="lic-metric-card__sep">/</span>
                                                        <span class="lic-metric-card__total">{msg.orgHealth.licData.summary.ulPurchased}</span>
                                                        <span class="lic-metric-card__label">used</span>
                                                    </div>
                                                    <div class="lic-progress">
                                                        <div class="lic-progress__bar lic-progress__bar--ul"></div>
                                                    </div>
                                                    <div class="lic-metric-card__util">{msg.orgHealth.licData.summary.ulUtil}% utilisation</div>
                                                </div>
                                                <!-- PSL Licenses card -->
                                                <div class="lic-metric-card">
                                                    <div class="lic-metric-card__header">
                                                        <span class="lic-metric-card__title">Permission Set Licenses</span>
                                                        <span class="lic-metric-card__badge lic-metric-card__badge--warn">{msg.orgHealth.licData.summary.pslWasted} wasted types</span>
                                                    </div>
                                                    <div class="lic-metric-card__nums">
                                                        <span class="lic-metric-card__used">{msg.orgHealth.licData.summary.pslUsed}</span>
                                                        <span class="lic-metric-card__sep">/</span>
                                                        <span class="lic-metric-card__total">{msg.orgHealth.licData.summary.pslPurchased}</span>
                                                        <span class="lic-metric-card__label">assigned</span>
                                                    </div>
                                                    <div class="lic-progress">
                                                        <div class="lic-progress__bar lic-progress__bar--psl"></div>
                                                    </div>
                                                    <div class="lic-metric-card__util">{msg.orgHealth.licData.summary.pslUtilPct} utilisation</div>
                                                </div>
                                            </div>

                                            <!-- Wasted User License types table -->
                                            <template if:true={msg.orgHealth.licData.hasLicWasted}>
                                                <div class="lic-waste-section">
                                                    <div class="lic-waste-section__title">&#x1F4B8; Unused User License Types</div>
                                                    <div class="lic-waste-table">
                                                        <template for:each={msg.orgHealth.licData.licWasted} for:item="w">
                                                            <div key={w.name} class="lic-waste-row">
                                                                <span class="lic-waste-row__name">{w.name}</span>
                                                                <span class="lic-waste-row__qty">{w.qty} purchased</span>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>

                                            <!-- Wasted PSL types table -->
                                            <template if:true={msg.orgHealth.licData.hasPslWasted}>
                                                <div class="lic-waste-section">
                                                    <div class="lic-waste-section__title">&#x1F4B8; Unused Permission Set Licenses</div>
                                                    <div class="lic-waste-table">
                                                        <template for:each={msg.orgHealth.licData.pslWasted} for:item="w">
                                                            <div key={w.name} class="lic-waste-row">
                                                                <span class="lic-waste-row__name">{w.name}</span>
                                                                <span class="lic-waste-row__qty">{w.qty} purchased</span>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>

                                            <!-- Summary findings (✅ / ⚠️) -->
                                            <template if:true={msg.orgHealth.licData.hasFindings}>
                                                <template for:each={msg.orgHealth.licData.licFindings} for:item="f">
                                                    <div key={f} class="health-sec__finding">{f}</div>
                                                </template>
                                            </template>
                                        </template>

                                    </div>
                                </template>
                                <template if:false={msg.isReferenceReport}>
                                    <template if:false={msg.isOrgHealth}>
                                        <p class="msg-text">{msg.text}</p>
                                    </template>
                                </template>
                                <template if:true={msg.isSuccess}>
                                    <div class="msg-success-tag">
                                        <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
                                            <path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                        Action completed
                                    </div>
                                </template>
                                <template if:true={msg.isError}>
                                    <div class="msg-error-tag">
                                        <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
                                            <circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.2"/>
                                            <path d="M6 4v3M6 8.5v.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                                        </svg>
                                        Failed
                                    </div>
                                </template>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Quick Action Chips -->
            <div class="agent-chips">
                <button class="chip" data-query="Show inactive flows" onclick={handleChipClick}>Inactive flows</button>
                <button class="chip" data-query="Show unused Apex classes" onclick={handleChipClick}>Unused classes</button>
                <button class="chip" data-query="Show unused triggers" onclick={handleChipClick}>Unused triggers</button>
                <button class="chip" data-query="Show unassigned Profiles" onclick={handleChipClick}>Unused Profiles</button>
                <button class="chip" data-query="Show unused Permission Sets" onclick={handleChipClick}>Unused Perm Sets</button>
                <button class="chip" data-query="Show inactive validation rules" onclick={handleChipClick}>Inactive Val. Rules</button>
                <button class="chip chip--vf" data-query="Show unreferenced VF pages" onclick={handleChipClick}>VF Pages</button>
                <button class="chip chip--vf" data-query="Show unreferenced VF components" onclick={handleChipClick}>VF Components</button>
                <!-- Export Button — opens modal -->
                <button class="export-btn" onclick={toggleExportDropdown}>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span>Export</span>
                </button>
            </div>

            <!-- Input Row -->
            <div class="agent-input-row">
                <input
                    class="agent-input"
                    type="text"
                    placeholder="Ask the agent..."
                    value={agentInput}
                    oninput={handleAgentInputChange}
                    onkeydown={handleAgentInputKeydown}
                    disabled={agentIsProcessing}
                />
                <button class="agent-send-btn" onclick={handleAgentSend} disabled={agentSendDisabled}>
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M14 8L2 2l3 6-3 6 12-6z" fill="currentColor"/>
                    </svg>
                </button>
            </div>

        </div><!-- end .agent-panel -->

        <!-- Hidden download anchor for CSV export (LWC-safe) -->
        <a class="export-download-link" style="display:none;" href="#" download="export.csv"></a>

        <!-- Toast notification -->
        <template if:true={showToast}>
            <div class="export-toast">{toastMessage}</div>
        </template>

        <!-- Hidden download anchor — LWC-safe -->
        <a class="export-download-link" style="display:none;" href="#" download="export.csv"></a>

        <!-- Toast -->
        <template if:true={showToast}>
            <div class="export-toast">{toastMessage}</div>
        </template>

        <!-- Export Modal -->
        <template if:true={showExportModal}>
            <div class="export-modal-overlay" onclick={handleCloseExport}>
                <div class="export-modal" onclick={_stopProp}>
                    <div class="export-modal-header">
                        <div class="export-modal-title">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            Export — {exportTabLabel}
                        </div>
                        <button class="export-modal-close" onclick={handleCloseExport}>✕</button>
                    </div>
                    <div class="export-modal-body">
                        <div class="export-modal-section-label">FORMAT</div>
                        <div class="export-fmt-row">
                            <button class={exportCsvClass}  data-format="csv"  onclick={handleExportFormatChange}>CSV</button>
                            <button class={exportJsonClass} data-format="json" onclick={handleExportFormatChange}>JSON</button>
                            <button class={exportTxtClass}  data-format="txt"  onclick={handleExportFormatChange}>TXT</button>
                        </div>
                        <p class="export-modal-hint">JSON / TXT for developer use.</p>
                    </div>
                    <div class="export-modal-footer">
                        <button class="export-action-btn export-action-btn--download" onclick={handleDownload}>
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            Download
                        </button>
                        <button class="export-action-btn export-action-btn--save" onclick={handleSaveToFiles} disabled={exportSaveDisabled}>
                            <template if:true={isSaving}>
                                <svg class="spin-icon" width="15" height="15" viewBox="0 0 16 16" fill="none">
                                    <path d="M13.65 2.35A8 8 0 1 0 15 8h-2a6 6 0 1 1-1.08-3.47L10 6h5V1l-1.35 1.35z" fill="currentColor"/>
                                </svg>
                            </template>
                            <template if:false={isSaving}>
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
                                </svg>
                            </template>
                            {exportSaveBtnLabel}
                        </button>
                    </div>
                </div>
            </div>
        </template>

    </div><!-- end .dashboard-shell -->
</template>
